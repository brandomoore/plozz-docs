name: Daily source-checked docs

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Review all guides even if app source is unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-docs
  cancel-in-progress: false

env:
  DOCS_WRITER_MODEL: gpt-6.1-sol
  DOCS_REVIEW_MODEL: gpt-6-astra

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_FORCE_REVIEW: ${{ inputs.force == true }}
        run: |
          npm run source:plan
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(".docs-work/plan.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `mode=${p.mode}\nbase=${p.baseDocsHead}\n`);'
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.mode != 'none'
        with:
          name: frozen-source
          path: |
            .docs-work/plan.json
            .docs-work/tree.json
            .docs-work/discovery.json
            .docs-work/source-labels.json
            .docs-work/source/
          include-hidden-files: true
          retention-days: 7

  write:
    needs: plan
    if: needs.plan.outputs.mode == 'content'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: frozen-source
          path: .docs-work
      - run: npm install --global @github/copilot@1.0.98
      - run: npm run agent:write
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: write-assessment
          path: .docs-work/write-response.txt
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: proposed-content
          path: content/
          retention-days: 7

  review:
    needs: [plan, write]
    if: needs.plan.outputs.mode == 'content'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: frozen-source
          path: .docs-work
      - uses: actions/download-artifact@v4
        with:
          name: proposed-content
          path: .docs-work/proposal
      - run: node tools/apply-proposal.mjs .docs-work/proposal
      - run: npm install --global @github/copilot@1.0.98
      - run: npm run agent:review
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-assessment
          path: .docs-work/review-response.txt
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-content
          path: content/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: review-receipt
          path: .docs-work/review.json
          include-hidden-files: true
          retention-days: 7

  publish:
    needs: [plan, review]
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.mode == 'metadata' || needs.plan.outputs.mode == 'deploy' || needs.review.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.docs_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.base }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: frozen-source
          path: .docs-work
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.mode == 'content'
        with:
          name: reviewed-content
          path: .docs-work/proposal
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.mode == 'content'
        with:
          name: review-receipt
          path: .docs-work
      - if: needs.plan.outputs.mode == 'content'
        run: node tools/apply-proposal.mjs .docs-work/proposal
      - if: needs.plan.outputs.mode != 'deploy'
        run: npm run source:finalize
      - run: npm run check && npm test && npm run build
      - id: commit
        run: node tools/publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication
          path: .docs-work/publication.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  deploy:
    needs: publish
    if: always() && needs.publish.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-site.yml
    with:
      revision: ${{ needs.publish.outputs.revision }}
